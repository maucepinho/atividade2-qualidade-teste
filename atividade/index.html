<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="https://www.cps.sp.gov.br/favicon.ico" />
  <title>Atividade</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Cadastro de alunos</h1>
    <section aria-labelledby="form-title">
      <h2 id="form-title">Novo aluno</h2>
      <form id="student-form" data-testid="student-form">
        <label for="ra">RA</label>
        <input id="ra" name="ra" data-testid="ra" type="number" min="1" max="2147483647" step="1" required>
        <label for="name">Nome</label>
        <input id="name" name="name" data-testid="name" type="text" minlength="3" maxlength="100" required>
        <button id="submit" data-testid="submit" type="submit">Cadastrar aluno</button>
      </form>
      <p id="form-message" data-testid="form-message" role="status" aria-live="polite"></p>
    </section>
    <section id="students" aria-labelledby="list-title" aria-busy="false">
      <h2 id="list-title">Alunos cadastrados</h2>
      <p id="list-message" data-testid="list-message" role="status" aria-live="polite"></p>
      <div class="table-container">
        <table data-testid="students-table">
          <thead><tr><th scope="col">RA</th><th scope="col">Nome</th></tr></thead>
          <tbody id="students-list" data-testid="students-list"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
